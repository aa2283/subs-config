name: Sub-Store Integrated Sync-129
on:
  #schedule:
    #- cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-service:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. 环境准备与双隧道抢占
        run: |
          # 下载 Cloudflared
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          touch tunnel_8299.log tunnel_8199.log

          # 启动隧道 (即使 8199 还没亮，也先占住域名)
          nohup ./cloudflared tunnel --url http://127.0.0.1:8299 --logfile tunnel_8299.log > /dev/null 2>&1 &
          nohup ./cloudflared tunnel --url http://127.0.0.1:8199 --http-host-header "localhost:8199" --logfile tunnel_8199.log > /dev/null 2>&1 &

          sleep 5
          URL_8299=$(grep -oE 'https://[-0-9a-z]*\.trycloudflare\.com' tunnel_8299.log | head -n 1)
          URL_8199=$(grep -oE 'https://[-0-9a-z]*\.trycloudflare\.com' tunnel_8199.log | head -n 1)

          echo "::add-mask::$URL_8299"
          echo "::add-mask::$URL_8199"
          echo "------------------------------------------------"
          echo "🔗 Sub-Store (8299): $URL_8299"
          echo "🔗 Subs-Check (8199): $URL_8199/admin"
          echo "------------------------------------------------"
          # 这里可以根据需要加回同步 KV 的代码
          # 提取隧道域名并同步到 KV
          if [ -n "$URL_8299" ] && [ -n "$URL_8199" ]; then
          # 存入 8299 (API)
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/storage/kv/namespaces/${{ secrets.CF_KV_ID }}/values/TARGET_API" \
          -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" --data "$URL_8299"
  
          # 存入 8199 (Admin)
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/storage/kv/namespaces/${{ secrets.CF_KV_ID }}/values/TARGET_API_8199" \
          -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" --data "$URL_8199"
    
          echo "✅ 隧道地址已按 Worker B 规范同步至 KV"
          fi

      - name: 3. 启动后台服务 (暴力修复权限与挂载)
        run: |
          # 1. 彻底清理旧的残余 (防止文件夹占位文件)
          sudo docker rm -f subs-manager checker || true
          
          # 2. 准备干净的目录
          mkdir -p ${{ github.workspace }}/output
          mkdir -p ${{ github.workspace }}/temp_config
          
          # 【关键修复】如果 config.yaml 误变成了目录，强行删掉它
          if [ -d "${{ github.workspace }}/temp_config/config.yaml" ]; then
            echo "⚠️ 检测到 config.yaml 是个错误目录，正在强制纠正..."
            sudo rm -rf "${{ github.workspace }}/temp_config/config.yaml"
          fi
          
          # 3. 预先创建文件，防止 Docker 再次把它当成目录
          touch "${{ github.workspace }}/temp_config/config.yaml"
          
          # 4. 执行配置注入
          export RAW_URLS_DATA="${{ secrets.SUB_URLS }}"
          python3 -c "
          import os
          template_path = '${{ github.workspace }}/config/config.yaml'
          output_path = '${{ github.workspace }}/temp_config/config.yaml'
          raw_urls = os.environ.get('RAW_URLS_DATA', '').strip().split('\n')
          formatted_urls = [f'  - \"{u.strip()}\"\n' for u in raw_urls if len(u.strip()) > 10]
          new_lines = ['show-useless-url: true\n']
          if os.path.exists(template_path):
              with open(template_path, 'r', encoding='utf-8') as f:
                  for line in f:
                      if '{SUB_URLS}' in line: new_lines.extend(formatted_urls)
                      else: new_lines.append(line)
          with open(output_path, 'w', encoding='utf-8') as f:
              f.writelines(new_lines)
          "

          # 5. 权限大赦：给所有挂载目录 777
          sudo chmod -R 777 ${{ github.workspace }}/output
          sudo chmod -R 777 ${{ github.workspace }}/temp_config

          # 🚀 启动管理后台
          echo "🚀 启动全功能管理后台..."
          docker run -d --name subs-manager \
            -p 8299:8299 \
            -p 8199:8199 \
            -v ${{ github.workspace }}/output:/opt/sub-store/data \
            -v ${{ github.workspace }}/temp_config/config.yaml:/app/config/config.yaml \
            ghcr.io/beck-8/subs-check:latest

          echo "⏳ 等待容器内部服务初始化..."
          sleep 20

          mkdir -p ${{ github.workspace }}/output
          
          echo "📥 正在从 KV 恢复配置..."
          # 从 KV 获取数据并写入文件
          RESPONSE=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/storage/kv/namespaces/${{ secrets.CF_KV_ID }}/values/SUB_STORE_CONFIG" \
               -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}")
          
          # 简单校验：如果 KV 是空的或者报错，不覆盖本地，防止洗掉数据
          if [ -n "$RESPONSE" ] && [[ "$RESPONSE" != *"error"* ]]; then
            echo "$RESPONSE" > ${{ github.workspace }}/output/sub-store.json
            echo "✅ 配置恢复成功"
          else
            echo "⚠️ KV 为空或读取失败，将使用初始配置"
          fi

          sudo chmod -R 777 ${{ github.workspace }}/output
          
          # 检查容器状态
          if docker ps | grep -q 'subs-manager'; then
            echo "✅ 容器 subs-manager 运行中"
            docker logs --tail 20 subs-manager
          else
            echo "❌ 容器启动后崩溃了，查看原因："
            docker logs subs-manager
            exit 1
          fi

      - name: 5. 挂机守护 (防御性修正)
        run: |
          # 防止因为文件还没生成导致 cp 失败挂掉
          mkdir -p output
          touch output/sub-store.json
          # ... 后面接你原来的逻辑
          echo "📂 准备私有备份库..."
          git clone https://${{ secrets.PAT_TOKEN }}@github.com/aa2283/v2ray_configs.git backup_repo
          git config --global user.email "bot@github.com"
          git config --global user.name "AutoBot"
          cp -f output/sub-store.json ./snapshot.json

          # 后台备份哨兵
          (
            while true; do
              sleep 30
              if ! diff -q output/sub-store.json ./snapshot.json >/dev/null 2>&1; then
                echo "📢 检测到配置更新，同步中..."
                cp -f output/sub-store.json ./snapshot.json
                # A. 同步到 KV
                curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/storage/kv/namespaces/${{ secrets.CF_KV_ID }}/values/SUB_STORE_CONFIG" \
                  -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" --data-binary @output/sub-store.json > /dev/null
                # B. 同步到私有库 (调用已经跑在后台的 8299 端口)
                LIST="${{ vars.SUB_LIST || 'zh:ClashMeta' }}"
                IFS=',' read -ra ITEMS <<< "$LIST"
                for item in "${ITEMS[@]}"; do
                  NAME="${item%%:*}"; TYPE="${item##*:}"
                  [[ "$TYPE" == *"Clash"* ]] && EXT="yaml" || EXT="txt"
                  curl -s "http://127.0.0.1:8299/download/${NAME}?target=${TYPE}" -o "backup_repo/sub_config/${NAME}.${EXT}"
                done
                cp -f output/sub-store.json backup_repo/sub_config/sub-store.json
                cd backup_repo && git add . && git commit -m "🔖 网页备份: $(date +'%H:%M')" && git push origin main || true
                cd ..
              fi
            done
          ) &

          # 保持运行 15 分钟
          for i in {15..1}; do
            echo "⏳ 8199 管理页面在线中... 剩余 $i 分钟"
            sleep 60
          done
