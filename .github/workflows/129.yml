name: Sub-Store Integrated Sync-129
on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-service:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. 环境准备与双隧道抢占
        run: |
          # 下载 Cloudflared
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          touch tunnel_8299.log tunnel_8199.log

          # 启动隧道 (即使 8199 还没亮，也先占住域名)
          nohup ./cloudflared tunnel --url http://127.0.0.1:8299 --logfile tunnel_8299.log > /dev/null 2>&1 &
          nohup ./cloudflared tunnel --url http://127.0.0.1:8199 --http-host-header "localhost:8199" --logfile tunnel_8199.log > /dev/null 2>&1 &

          sleep 5
          URL_8299=$(grep -oE 'https://[-0-9a-z]*\.trycloudflare\.com' tunnel_8299.log | head -n 1)
          URL_8199=$(grep -oE 'https://[-0-9a-z]*\.trycloudflare\.com' tunnel_8199.log | head -n 1)
          
          echo "------------------------------------------------"
          echo "🔗 Sub-Store (8299): $URL_8299"
          echo "🔗 Subs-Check (8199): $URL_8199/admin"
          echo "------------------------------------------------"
          # 这里可以根据需要加回同步 KV 的代码

      - name: 3. 启动常驻服务 & 执行检测任务 (修复崩溃版)
        run: |
          # 1. 深度清理权限
          mkdir -p ${{ github.workspace }}/output ${{ github.workspace }}/temp_config
          sudo chmod -R 777 ${{ github.workspace }}/output
          sudo chmod -R 777 ${{ github.workspace }}/temp_config

          # --- 步骤 A: 启动管理后台 (保持 -d) ---
          docker run -d --name subs-manager \
            -p 8299:8299 \
            -p 8199:8199 \
            -v ${{ github.workspace }}/output:/opt/sub-store/data \
            -v ${{ github.workspace }}/temp_config/config.yaml:/app/config/config.yaml \
            ghcr.io/beck-8/subs-check:latest

          sleep 10

          # --- 步骤 B: 执行检测任务 (关键修改：去掉 --network host) ---
          # 这样它就不会去抢宿主机的 8199 端口，从而停止 bind error 重启循环
          echo "🚀 开始实时检测逻辑..."
          docker run --name checker --rm -t \
            -v ${{ github.workspace }}/temp_config:/app/config \
            -v ${{ github.workspace }}/output:/app/output \
            ghcr.io/aa2283/subs-check:master || true

      - name: 5. 挂机守护与单向同步备份
        run: |
          echo "📂 准备私有备份库..."
          git clone https://${{ secrets.PAT_TOKEN }}@github.com/aa2283/v2ray_configs.git backup_repo
          git config --global user.email "bot@github.com"
          git config --global user.name "AutoBot"
          cp -f output/sub-store.json ./snapshot.json

          # 后台备份哨兵
          (
            while true; do
              sleep 30
              if ! diff -q output/sub-store.json ./snapshot.json >/dev/null 2>&1; then
                echo "📢 检测到配置更新，同步中..."
                cp -f output/sub-store.json ./snapshot.json
                # A. 同步到 KV
                curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/storage/kv/namespaces/${{ secrets.CF_KV_ID }}/values/SUB_STORE_CONFIG" \
                  -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" --data-binary @output/sub-store.json > /dev/null
                # B. 同步到私有库 (调用已经跑在后台的 8299 端口)
                LIST="${{ vars.SUB_LIST || 'zh:ClashMeta' }}"
                IFS=',' read -ra ITEMS <<< "$LIST"
                for item in "${ITEMS[@]}"; do
                  NAME="${item%%:*}"; TYPE="${item##*:}"
                  [[ "$TYPE" == *"Clash"* ]] && EXT="yaml" || EXT="txt"
                  curl -s "http://127.0.0.1:8299/download/${NAME}?target=${TYPE}" -o "backup_repo/sub_config/${NAME}.${EXT}"
                done
                cp -f output/sub-store.json backup_repo/sub_config/sub-store.json
                cd backup_repo && git add . && git commit -m "🔖 网页备份: $(date +'%H:%M')" && git push origin main || true
                cd ..
              fi
            done
          ) &

          # 保持运行 15 分钟
          for i in {15..1}; do
            echo "⏳ 8199 管理页面在线中... 剩余 $i 分钟"
            sleep 60
          done
