name: Sub-Store Integrated Dual-Tunnel-Safe
on:
  #schedule:
    #- cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-service:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. 双隧道准备 (8299 & 8199)
        run: |
          # 环境清理与目录预设
          mkdir -p ${{ github.workspace }}/output ${{ github.workspace }}/temp_config
          sudo chmod -R 777 ${{ github.workspace }}/output
          
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          touch tunnel_8299.log tunnel_8199.log
          
          # 启动双隧道
          echo "🚀 正在启动双隧道..."
          nohup ./cloudflared tunnel --url http://127.0.0.1:8299 --logfile tunnel_8299.log > /dev/null 2>&1 &
          nohup ./cloudflared tunnel --url http://127.0.0.1:8199 --http-host-header "localhost:8199" --logfile tunnel_8199.log > /dev/null 2>&1 &
          
          # 循环提取域名并写入 KV
          for i in {1..30}; do
            URL_8299=$(grep -oE 'https://[-0-9a-z]*\.trycloudflare\.com' tunnel_8299.log | head -n 1)
            URL_8199=$(grep -oE 'https://[-0-9a-z]*\.trycloudflare\.com' tunnel_8199.log | head -n 1)
            
            if [ -n "$URL_8299" ] && [ -n "$URL_8199" ]; then
              echo "::add-mask::$URL_8299"
              echo "::add-mask::$URL_8199"
              
              # 同步到 KV
              curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/storage/kv/namespaces/${{ secrets.CF_KV_ID }}/values/TARGET_API" \
                -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" -d "$URL_8299" > /dev/null
              curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/storage/kv/namespaces/${{ secrets.CF_KV_ID }}/values/TARGET_API_8199" \
                -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" -d "$URL_8199" > /dev/null
              
              echo "✅ 双隧道已就绪！"
              echo "🔗 Sub-Store (8299): $URL_8299"
              echo "🔗 Admin (8199): $URL_8199/admin"
              break
            fi
            [ $i -eq 30 ] && (echo "❌ 隧道启动超时"; exit 1)
            sleep 1
          done

      - name: 3. 配置恢复与环境初始化
        run: |
          echo "📥 正在从 KV 恢复配置..."
          # 获取数据
          RESPONSE=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/storage/kv/namespaces/${{ secrets.CF_KV_ID }}/values/SUB_STORE_CONFIG" \
               -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}")
          
          # 严格校验：确保 RESPONSE 是合法的 JSON (包含 key)
          if [[ "$RESPONSE" == *"subscribes"* ]]; then
            echo "$RESPONSE" > ${{ github.workspace }}/output/sub-store.json
            echo "✅ 配置恢复成功 (Size: $(stat -c%s ${{ github.workspace }}/output/sub-store.json) bytes)"
          else
            echo "⚠️ KV 暂无有效配置，跳过覆盖以防止丢失。"
          fi

          # Python 处理 config.yaml 注入
          export RAW_URLS_DATA="${{ secrets.SUB_URLS }}"
          python3 -c "
          import os
          t_path = '${{ github.workspace }}/config/config.yaml'
          o_path = '${{ github.workspace }}/temp_config/config.yaml'
          raw_urls = os.environ.get('RAW_URLS_DATA', '').strip().split('\n')
          formatted = [f'  - \"{u.strip()}\"\n' for u in raw_urls if len(u.strip()) > 10]
          lines = ['show-useless-url: true\n']
          if os.path.exists(t_path):
              with open(t_path, 'r', encoding='utf-8') as f:
                  for line in f:
                      if '{SUB_URLS}' in line: lines.extend(formatted)
                      elif 'show-useless-url' in line: continue
                      else: lines.append(line)
          with open(o_path, 'w', encoding='utf-8') as f: f.writelines(lines)
          "
          sudo chmod -R 777 ${{ github.workspace }}/output ${{ github.workspace }}/temp_config

      - name: 4. 运行检测并启动哨兵
        run: |
          # 建立快照用于 diff
          [ -f "output/sub-store.json" ] && cp -f output/sub-store.json ./snapshot.json || echo "{}" > ./snapshot.json

          # 启动容器
          docker run --name checker -d \
            -p 8299:8299 -p 8199:8199 \
            -v ${{ github.workspace }}/temp_config:/app/config \
            -v ${{ github.workspace }}/output:/app/output \
            -v ${{ github.workspace }}/output:/opt/sub-store/data \
            ghcr.io/aa2283/subs-check:master

          # 单向备份哨兵进程
          (
            echo ">>> [哨兵] 双向同步守护已启动..."
            while true; do
              sleep 30
              if ! diff -q output/sub-store.json ./snapshot.json >/dev/null 2>&1; then
                # 只有当新文件大小不为 0 且有效时才同步
                if [ -s "output/sub-store.json" ]; then
                  echo "📢 检测到配置更改，执行实时备份..."
                  cp -f output/sub-store.json ./snapshot.json
                  
                  # 备份到 KV
                  curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/storage/kv/namespaces/${{ secrets.CF_KV_ID }}/values/SUB_STORE_CONFIG" \
                    -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
                    --data-binary @output/sub-store.json > /dev/null
                  
                  # 备份到私有库
                  # (此处可根据需要添加你的 git push 逻辑)
                  echo "✅ 备份已同步至云端"
                fi
              fi
            done
          ) &
          
          # 挂机维持 15 分钟
          for i in {15..1}; do
            echo "⏳ 系统在线中... 剩余 $i 分钟"
            sleep 60
          done
