name: Sub-Store Professional Sync
on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

jobs:
  integrated-run:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 环境准备与隧道抢占
        run: |
          # 下载 Cloudflared
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          
          # 启动双隧道
          nohup ./cloudflared tunnel --url http://127.0.0.1:8299 --logfile t8299.log > /dev/null 2>&1 &
          nohup ./cloudflared tunnel --url http://127.0.0.1:8199 --logfile t8199.log > /dev/null 2>&1 &
          
          sleep 10
          URL_8299=$(grep -oE 'https://[-0-9a-z]*\.trycloudflare\.com' t8299.log | head -n 1)
          URL_8199=$(grep -oE 'https://[-0-9a-z]*\.trycloudflare\.com' t8199.log | head -n 1)
          
          # 安全掩码与 KV 同步域名 (供 Workers 使用)
          echo "::add-mask::$URL_8299"
          echo "::add-mask::$URL_8199"
          
          # 将隧道地址同步给 Worker B 使用的键名
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/storage/kv/namespaces/${{ secrets.CF_KV_ID }}/values/TARGET_API" -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" --data "$URL_8299"
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/storage/kv/namespaces/${{ secrets.CF_KV_ID }}/values/TARGET_API_8199" -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" --data "$URL_8199"

          echo "------------------------------------------------"
          echo "🔗 Sub-Store (8299): $URL_8299"
          echo "🔗 Subs-Check (8199): $URL_8199/admin"
          echo "------------------------------------------------"

      - name: 2. 恢复配置并启动容器
        run: |
          mkdir -p ${{ github.workspace }}/output ${{ github.workspace }}/temp_config
          
          # A. 从 KV 恢复 sub-store.json (热数据)
          echo "📥 正在恢复云端配置..."
          curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/storage/kv/namespaces/${{ secrets.CF_KV_ID }}/values/SUB_STORE_CONFIG" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" > ${{ github.workspace }}/output/sub-store.json
          
          # 如果 KV 为空，初始化基础结构
          if [ ! -s "${{ github.workspace }}/output/sub-store.json" ] || grep -q "error" "${{ github.workspace }}/output/sub-store.json"; then
             echo '{"subscribes":[],"nodes":[],"sub-store-backend":[]}' > ${{ github.workspace }}/output/sub-store.json
          fi

          # B. 启动常驻容器 (使用你之前的修复逻辑)
          touch ${{ github.workspace }}/temp_config/config.yaml
          # (此处省略 Python 注入 config.yaml 的代码，保持你原来的逻辑)
          
          sudo chmod -R 777 ${{ github.workspace }}/output
          docker run -d --name subs-manager \
            -p 8299:8299 -p 8199:8199 \
            -v ${{ github.workspace }}/output:/opt/sub-store/data \
            -v ${{ github.workspace }}/temp_config/config.yaml:/app/config/config.yaml \
            ghcr.io/beck-8/subs-check:latest
          
          sleep 15

      - name: 3. 实时哨兵监控与双路备份
        run: |
          # 初始 MD5
          LAST_MD5=$(md5sum ${{ github.workspace }}/output/sub-store.json | cut -d ' ' -f1)
          
          # 准备私有库备份环境
          git clone https://${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository_owner }}/backup-repo.git backup_repo || mkdir backup_repo
          
          echo "🛰️ 哨兵已就位，开始 15 分钟实时监控..."
          for i in {1..90}; do
            sleep 10
            CURRENT_MD5=$(md5sum ${{ github.workspace }}/output/sub-store.json | cut -d ' ' -f1)
            
            if [ "$CURRENT_MD5" != "$LAST_MD5" ]; then
              echo "🔔 检测到配置更改，执行双同步..."
              
              # 1. 同步到 KV
              curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/storage/kv/namespaces/${{ secrets.CF_KV_ID }}/values/SUB_STORE_CONFIG" \
                -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" --data-binary @${{ github.workspace }}/output/sub-store.json
              
              # 2. 同步到私有库
              cp ${{ github.workspace }}/output/sub-store.json backup_repo/
              cd backup_repo && git config user.name "Bot" && git config user.email "bot@github.com"
              git add . && git commit -m "Auto-Update $(date +'%H:%M:%S')" && git push || true
              cd ..
              
              LAST_MD5=$CURRENT_MD5
            fi
            
            # 心跳显示
            if (( i % 6 == 0 )); then echo "⏳ 已运行 $((i/6)) 分钟..."; fi
          done
